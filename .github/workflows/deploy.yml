name: Deploy to cPanel (FTP)

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Adapt paths for the live domain root
        # Local copy lives at /guco/; the live site is at the domain root.
        run: sed -i 's#/guco/#/#g' .htaccess
      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          # Never overwrite live data or server-only settings.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.local.php
            DEPLOYMENT.md
            README.md
